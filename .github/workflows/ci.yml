name: CI

on:
  pull_request:
  push:
    branches:
      - main

# 全jobで、リポジトリの読み取り権限だけを付与する（書き込み・PRコメント等の権限は不要）
permissions:
  contents: read

jobs:
  quality-checks:
    name: Format / Lint / Typecheck / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Generate Next.js types
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      # クラウドSupabase（GitHub Secrets）には接続しない。ビルドに必要な環境変数はダミー値を使う
      # （本番ビルドはDBへアクセスしない。next.config.ts と src/lib/supabase.ts が値の存在だけを確認する）
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-publishable-key
        run: npm run build

      # タイムゾーンをUTCに明示する。手元（日本時間）では必ず正しく見える日時のずれを、
      # 日本時間以外の環境で実行して機械的に見つけるため（runnerの既定値には頼らない）
      - name: Unit tests
        env:
          TZ: UTC
        run: npm run test

  # RLS・DB関数・アカウント削除（ON DELETE CASCADE等）の統合テスト49件を、
  # このjob内で起動したローカルSupabase上で必ず実行する。
  # クラウドSupabase（GitHub Secrets）の接続情報は一切渡さない。
  # REQUIRE_LOCAL_SUPABASE=1 により、ローカルSupabaseが使えない場合はskipではなく失敗になる。
  integration-tests:
    name: Supabase Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRE_LOCAL_SUPABASE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      # supabase start は、起動の最後に、ローカルSupabaseのキー（Publishable・Secret など）を含む表を表示する。
      # このリポジトリは公開のため、Actionsのログも公開される。そのため、出力は一時ファイルへ保存し、ログには直接表示しない。
      # 失敗したときだけ、表の行を除き、キー・トークン形式の文字列を伏せた末尾60行を表示する。
      # 伏せられたことを確認できない場合は、詳細ログを表示しない。一時ファイルは、成功・失敗にかかわらず削除する。
      - name: Start local Supabase
        run: |
          start_log="$(mktemp "$RUNNER_TEMP/supabase-start.XXXXXX")"
          trap 'rm -f "$start_log"' EXIT
          if supabase start > "$start_log" 2>&1; then
            echo "Local Supabase started. (supabase start の出力は、キーを含むため、ログに表示しません)"
          else
            echo "::error::supabase start が失敗しました。"
            # 1) 表の罫線を含む行（キーの一覧が入る）を除く  2) キー・トークン形式の文字列を伏せる  3) 末尾60行だけにする
            safe_log="$(grep -vE '│|├|┌|└|┐|┘|┤|┬|┴|┼|─|╭|╮|╰|╯' "$start_log" \
              | sed -E 's/(sb_(secret|publishable)_)[A-Za-z0-9_-]+/\1***/g; s/eyJ[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*/***/g; s/[A-Za-z0-9_-]{32,}/***/g' \
              | tail -n 60 || true)"
            # 4) 伏せ残しがないか確認する。確認できない場合は、詳細ログを表示しない
            if printf '%s' "$safe_log" | grep -qE 'sb_(secret|publishable)_[A-Za-z0-9_-]{8,}|eyJ[A-Za-z0-9_-]{8,}|[A-Za-z0-9_-]{32,}'; then
              echo "::error::キーなどを伏せられたことを確認できないため、詳細ログは表示しません。"
            else
              printf '%s\n' "$safe_log"
            fi
            exit 1
          fi

      - name: Reset local database (migrations + seed)
        run: supabase db reset

      # supabase start で起動したこのjob専用のローカルSupabaseから、接続情報をその場で取得する。
      # 値はログに出さない（::add-mask::）。固定値のSecrets登録は不要。
      - name: Export local Supabase connection info for tests
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/supabase-status.env"
          supabase status -o env > "$status_file"

          # 指定した名前を順に探し、最初に見つかった値（引用符なし）を返す
          get_value() {
            local key line
            for key in "$@"; do
              line=$(grep -E "^${key}=" "$status_file" | head -n 1 || true)
              if [ -n "$line" ]; then
                line="${line#*=}"
                line="${line#\"}"
                line="${line%\"}"
                printf '%s' "$line"
                return 0
              fi
            done
            return 1
          }

          fail_missing() {
            echo "::error::supabase status -o env に $1 が見つかりません。出力されているキー名: $(cut -d= -f1 "$status_file" | tr '\n' ' ')"
            exit 1
          }

          api_url=$(get_value API_URL) || fail_missing "API_URL"
          anon_key=$(get_value ANON_KEY PUBLISHABLE_KEY) || fail_missing "ANON_KEY / PUBLISHABLE_KEY"
          admin_key=$(get_value SECRET_KEY SERVICE_ROLE_KEY) || fail_missing "SECRET_KEY / SERVICE_ROLE_KEY"

          echo "::add-mask::$anon_key"
          echo "::add-mask::$admin_key"
          {
            echo "TEST_LOCAL_SUPABASE_URL=$api_url"
            echo "TEST_LOCAL_SUPABASE_ANON_KEY=$anon_key"
            echo "TEST_LOCAL_ADMIN_KEY=$admin_key"
          } >> "$GITHUB_ENV"
          rm -f "$status_file"

      - name: Run integration tests (49 tests)
        run: npm run test:integration -- --reporter=default --reporter=json --outputFile.json=vitest-integration-results.json

      # 49件すべて成功・skipped 0・failed 0であることを確認する（1件でもskipがあれば失敗）
      - name: Verify no integration test was skipped
        if: always()
        run: node scripts/check-integration-skips.mjs vitest-integration-results.json

      - name: Upload integration test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: vitest-integration-results.json
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run test:e2e

      - name: Fail if any E2E test was skipped
        if: always()
        run: node scripts/check-e2e-skips.mjs playwright-results.json

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
            playwright-results.json
          if-no-files-found: ignore
          retention-days: 7
